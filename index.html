<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Rutina">
<meta name="theme-color" content="#1F5673">
<title>Mi Rutina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --orange:#1F5673;--orange-dark:#16425A;--orange-light:#E4EDF2;
  --bg:#0F0F0F;--bg2:#1A1A1A;--bg3:#242424;--bg4:#2E2E2E;
  --text:#F0EDE8;--text2:#A09890;--text3:#6A6460;
  --border:#2E2E2E;--border2:#3A3A3A;
  --green:#4CAF50;--green-bg:#1A2E1A;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* HEADER */
.header{background:var(--bg2);padding:env(safe-area-inset-top,0) 16px 0;border-bottom:1px solid var(--border);flex-shrink:0}
.header-inner{display:flex;align-items:center;gap:12px;padding:12px 0 12px}
.logo{width:36px;height:36px;background:var(--orange);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:20px;height:20px;fill:#fff}
.header-text h1{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--text);line-height:1}
.header-text p{font-size:11px;color:var(--text2);margin-top:2px}
.week-pill{margin-left:auto;background:var(--orange);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;cursor:pointer;white-space:nowrap}

/* NAV TABS */
.nav{display:flex;background:var(--bg2);border-top:1px solid var(--border);padding:0 0 env(safe-area-inset-bottom,0);flex-shrink:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;border:none;background:none;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:9px;cursor:pointer;transition:color .15s;-webkit-tap-highlight-color:transparent}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--orange)}

/* SCROLL AREA */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.page{display:none;padding:12px 12px 20px}
.page.active{display:block}

/* WEEK MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0)+20px);width:100%}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;margin-bottom:16px;color:var(--text)}
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.week-opt{padding:12px 4px;border:1px solid var(--border2);border-radius:var(--radius-sm);text-align:center;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);background:var(--bg3);transition:all .15s}
.week-opt.active{background:var(--orange);border-color:var(--orange);color:#fff}

/* EDIT ROUTINE BUTTON */
.edit-routine-btn{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--orange);font-family:'DM Sans',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.routine-bar{display:flex;gap:8px;margin-bottom:10px}
.routine-select{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 12px;font-size:14px;font-weight:600;color:var(--text);font-family:'DM Sans',sans-serif;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23A09890' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
.routine-select:focus{outline:none;border-color:var(--orange)}
.routine-manage-btn{width:44px;flex-shrink:0;background:var(--orange);border:none;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer}
.routine-manage-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round}
.rt-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px}
.rt-item.rt-active{border-color:var(--orange);background:rgba(31,86,115,.12)}
.rt-item-main{flex:1;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.rt-item-main strong{font-size:14px;color:var(--text)}
.rt-item-main span{font-size:11px;color:var(--text2)}
.rt-item-btn{width:34px;height:34px;border:none;background:var(--bg);border-radius:8px;cursor:pointer;font-size:15px;flex-shrink:0}
.edit-routine-btn:active{background:var(--bg3)}

/* EDITOR MODAL */
.editor-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;flex-direction:column}
.editor-overlay.open{display:flex}
.editor-panel{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:680px;margin:0 auto;width:100%;background:var(--bg)}
.editor-header{display:flex;align-items:center;padding:env(safe-area-inset-top,12px) 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.editor-header h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--text);flex:1}
.editor-close{width:32px;height:32px;border:none;background:var(--bg3);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.editor-close svg{width:18px;height:18px;stroke:var(--text2);fill:none;stroke-width:2;stroke-linecap:round}
.editor-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.editor-body::-webkit-scrollbar{display:none}
.editor-footer{flex-shrink:0;display:flex;gap:8px;padding:12px 16px calc(env(safe-area-inset-bottom,12px) + 12px);border-top:1px solid var(--border);background:var(--bg2)}
.editor-btn-primary{flex:1;padding:13px;background:var(--orange);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer}
.editor-btn-primary:active{background:var(--orange-dark)}
.editor-btn-secondary{flex:1;padding:13px;background:var(--bg3);color:var(--text2);border:1px solid var(--border2);border-radius:8px;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer}
.ed-day{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.ed-day-head{padding:12px 14px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ed-day-head input{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:7px 9px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;font-weight:600}
.ed-day-head input:focus{outline:none;border-color:var(--orange)}
.ed-day-label{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--orange);letter-spacing:.5px;white-space:nowrap}
.ed-ex{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:flex-start}
.ed-ex:last-child{border-bottom:none}
.ed-ex-fields{flex:1;display:flex;flex-direction:column;gap:6px}
.ed-ex-fields input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:7px 9px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif}
.ed-ex-fields input:focus{outline:none;border-color:var(--orange)}
.ed-ex-row{display:flex;gap:6px}
.ed-ex-row input{flex:1}
.ed-ex-del{width:30px;height:30px;border:none;background:rgba(231,112,112,.15);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ed-ex-del svg{width:15px;height:15px;stroke:#E87070;fill:none;stroke-width:2;stroke-linecap:round}
.ed-add-ex{width:100%;padding:9px;background:transparent;border:1px dashed var(--border2);border-radius:6px;color:var(--text2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;margin:8px 0}
.ed-add-ex:active{background:var(--bg3)}
.ed-field-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.ed-warn{font-size:11px;color:var(--text3);padding:8px 12px;line-height:1.5}

/* DAY CARDS */
.day-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.day-header{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.day-badge{background:var(--orange);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px;padding:3px 8px;border-radius:6px;flex-shrink:0}
.day-info{flex:1;min-width:0}
.day-info h2{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-info p{font-size:11px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-pct{font-size:12px;font-weight:600;color:var(--text2);flex-shrink:0}
.day-pct.done{color:var(--green)}
.day-chevron{flex-shrink:0;width:18px;height:18px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.day-chevron.open{transform:rotate(180deg)}

/* WARMUP */
.warmup-block{background:var(--bg3);padding:12px 16px;border-bottom:1px solid var(--border)}
.warmup-block h4{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--border2);color:var(--text2);background:var(--bg4)}
.chip-abs{background:rgba(31,86,115,.12);border-color:rgba(31,86,115,.30);color:#5B92AD}

/* EXERCISE */
.exercise{border-bottom:1px solid var(--border);padding:14px 16px}
.exercise:last-child{border-bottom:none}
.ex-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.ex-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(31,86,115,.15);color:var(--orange);font-weight:500;white-space:nowrap;margin-top:1px}
.ex-meta{font-size:11px;color:var(--text2);margin-bottom:10px}

/* SETS LIST (peso por serie) */
.sets-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.set-line{display:flex;align-items:center;gap:8px}
.set-num{width:30px;height:34px;border-radius:var(--radius-xs);border:1.5px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--text3);background:var(--bg3);transition:all .15s;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.set-done .set-num{background:var(--orange);border-color:var(--orange);color:#fff}
.set-num:active{transform:scale(.92)}
.set-rep{font-size:11px;color:var(--text2);width:56px;flex-shrink:0}
.set-weight{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-xs);padding:8px 10px;font-size:14px;font-weight:500;color:var(--text);font-family:'DM Sans',sans-serif;-webkit-appearance:none;appearance:none;min-width:0}
.set-weight:focus{outline:none;border-color:var(--orange)}
.set-weight::placeholder{color:var(--text3)}
.set-done .set-weight{border-color:rgba(31,86,115,.4)}
.prev-weight{font-size:10px;padding:3px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0;font-weight:500}
.prev-same{background:var(--bg4);color:var(--text2)}
.prev-up{background:rgba(76,175,80,.15);color:#6FCF76}
.prev-dn{background:rgba(231,112,112,.15);color:#E87070}

.inp-group{display:flex;flex-direction:column;gap:4px}
.inp-group label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3)}
.inp-group input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-xs);padding:9px 10px;font-size:14px;font-weight:500;color:var(--text);font-family:'DM Sans',sans-serif;width:100%;-webkit-appearance:none;appearance:none}
.inp-group input:focus{outline:none;border-color:var(--orange)}
.inp-group input::placeholder{color:var(--text3)}

.ex-bottom{display:flex;align-items:flex-end;gap:8px;margin-bottom:10px}
.inp-time{flex:1}

/* REST TIMER */
.rest-btn{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;transition:all .15s;flex-shrink:0}
.rest-btn.running{background:rgba(31,86,115,.15);border-color:rgba(31,86,115,.4);color:var(--orange)}
.rest-btn.done-rest{background:rgba(76,175,80,.15);border-color:rgba(76,175,80,.3);color:#6FCF76}
.rest-icon{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* NOTES */
.ex-notes{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-xs);padding:8px 10px;font-size:12px;color:var(--text2);font-family:'DM Sans',sans-serif;width:100%;resize:none;min-height:36px}
.ex-notes:focus{outline:none;border-color:var(--orange);color:var(--text)}
.ex-notes::placeholder{color:var(--text3)}

/* COPIAR SEMANA */
.copy-week-btn{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:500;color:var(--text2);font-family:'DM Sans',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.copy-week-btn:active{background:var(--bg3)}
.copy-week-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* BACKUP BANNER */
.backup-banner{background:rgba(31,86,115,.12);border:1px solid rgba(31,86,115,.3);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text)}
.backup-banner svg{width:18px;height:18px;stroke:var(--orange);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.backup-banner button{margin-left:auto;background:var(--orange);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;flex-shrink:0}
.backup-banner .bb-close{background:transparent;color:var(--text3);padding:6px 8px}

/* AEROBICO */
.aerobico-bar{background:rgba(31,86,115,.08);border-top:1px solid rgba(31,86,115,.2);padding:10px 16px;text-align:center;font-size:11px;color:var(--orange);font-weight:500}

/* SKIP & FINISH DAY */
.skip-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:8px 12px;font-size:11px;font-weight:500;color:var(--text3);font-family:'DM Sans',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0;white-space:nowrap}
.skip-btn.active{background:rgba(231,112,112,.15);border-color:rgba(231,112,112,.4);color:#E87070}
.skip-btn:active{transform:scale(.96)}
.set-filled .set-num{background:var(--orange);border-color:var(--orange);color:#fff}
.set-filled .set-weight{border-color:rgba(31,86,115,.4)}

/* BI-SERIE: dos pesos */
.bi-head{display:flex;gap:8px;padding-left:38px;margin-bottom:2px}
.bi-label-a,.bi-label-b{flex:1;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-bi .bi-inputs{flex:1;display:flex;gap:8px}
.bi-input-col{flex:1;display:flex;align-items:center;gap:5px;min-width:0}
.bi-input-col .set-weight{flex:1;min-width:0}
.bi-input-col .prev-weight{flex-shrink:0}
.ed-bi-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);cursor:pointer;padding:4px 0}
.ed-bi-toggle input{width:16px;height:16px;accent-color:var(--orange)}
.ex-skipped{opacity:.55}
.ex-skipped .sets-list{display:none}
.ex-skipped .inp-time{display:none}
.skip-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(231,112,112,.15);color:#E87070;font-weight:500;white-space:nowrap}
.day-finish-block{padding:12px 16px calc(env(safe-area-inset-bottom,0) + 4px);display:flex;flex-direction:column;gap:10px}
.finish-day-btn{width:100%;padding:13px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.finish-day-btn:active{background:var(--orange-dark)}
.reopen-day-btn{width:100%;padding:11px;background:var(--bg3);color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer}
.day-finish-summary{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dfs-item{font-size:12px;padding:5px 11px;border-radius:20px;font-weight:600}
.dfs-done{background:rgba(76,175,80,.15);color:#6FCF76}
.dfs-skip{background:rgba(231,112,112,.15);color:#E87070}
.dfs-pend{background:var(--bg4);color:var(--text2)}

/* PROGRESO PAGE */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;text-align:center}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.5px;color:var(--text);line-height:1}
.stat-lbl{font-size:10px;color:var(--text2);margin-top:3px}

.section-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px;margin-bottom:10px}
.section-card h3{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;color:var(--text);margin-bottom:12px}

.bar-chart{display:flex;align-items:flex-end;gap:5px;height:80px;margin-bottom:8px}
.bar-group{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px;height:100%}
.bar-wrap{flex:1;display:flex;align-items:flex-end;width:100%}
.bar{width:100%;background:var(--orange);border-radius:3px 3px 0 0;min-height:3px;transition:height .4s}
.bar-lbl{font-size:10px;color:var(--text2)}
.bar-val{font-size:9px;color:var(--orange);font-weight:600}

.prog-table{width:100%;border-collapse:collapse;font-size:11px}
.prog-table th{text-align:left;padding:5px 6px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.prog-table td{padding:6px 6px;border-bottom:1px solid var(--border);color:var(--text2)}
.prog-table td:first-child{color:var(--text);font-size:10px;max-width:120px}
.prog-table tr:last-child td{border-bottom:none}
.prog-day-label{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px;color:var(--text3);margin:12px 0 6px;padding:0 2px}

/* PROGRESO MEJORADO */
.prog-select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-xs);padding:10px 12px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;font-weight:500;margin-bottom:12px;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23A09890' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
.prog-select:focus{outline:none;border-color:var(--orange)}
.evo-pr-badge{font-size:13px;color:var(--text);background:var(--bg3);border-radius:var(--radius-xs);padding:8px 12px;margin-bottom:10px}
.evo-pr-badge strong{color:var(--orange)}
.evo-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.evo-table{width:100%;border-collapse:collapse;font-size:12px;min-width:280px}
.evo-table th{text-align:center;padding:7px 4px;color:var(--text3);font-weight:600;border-bottom:1px solid var(--border2);font-size:11px}
.evo-table th:first-child{text-align:left;width:60px}
.evo-table td{padding:8px 4px;text-align:center;color:var(--text);border-bottom:1px solid var(--border);font-size:13px;font-weight:500}
.evo-table .evo-set{text-align:left;color:var(--text2);font-size:11px;font-weight:400}
.evo-table tr:last-child td{border-bottom:none}
.evo-pr{background:rgba(31,86,115,.25);color:#7FB5CC;font-weight:700;border-radius:4px}
.evo-maxrow td{border-top:1.5px solid var(--border2);color:var(--orange);font-weight:600}
.evo-maxrow .evo-set{color:var(--orange);font-weight:600}
.evo-note{font-size:11px;color:var(--text3);margin-top:8px;line-height:1.5}
.pr-val{color:var(--orange)!important;font-weight:600;text-align:right;font-size:13px!important}
.pr-week{color:var(--text3)!important;text-align:right;width:50px;font-size:11px!important}

/* RESUMEN POR DÍA */
.dsum-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden}
.dsum-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.dsum-muscle{flex:1;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsum-pct{font-size:13px;font-weight:600;color:var(--text2)}
.dsum-pct.full{color:#6FCF76}
.dsum-body{padding:6px 12px 10px}
.dsum-ex{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--border)}
.dsum-ex:last-child{border-bottom:none}
.dsum-w{font-size:11px;flex-shrink:0}
.dsum-done span:first-child{color:var(--text)}
.dsum-done .dsum-w{color:#6FCF76;font-weight:600}
.dsum-skip span:first-child{color:var(--text2)}
.dsum-skip .dsum-w{color:#E87070}
.dsum-pend span:first-child{color:var(--text3)}
.dsum-pend .dsum-w{color:var(--text3)}

/* DASHBOARD / INICIO */
.hero-greeting{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;color:var(--text);margin-bottom:12px;padding:0 2px}
.checkin-card h3{margin-bottom:12px}
.checkin-idle,.checkin-active{display:flex;flex-direction:column;gap:8px}
.checkin-active{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.ci-info{font-size:13px;color:var(--text);line-height:1.5}
.ci-info span{font-size:11px;color:var(--text2)}
.ci-btn{padding:13px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ci-in{background:var(--orange);color:#fff;width:100%}
.ci-in:active{background:var(--orange-dark)}
.ci-out{background:#E87070;color:#fff;flex-shrink:0;padding:11px 18px}
.ci-manual-toggle{background:transparent;border:none;color:var(--text2);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;padding:8px;text-decoration:underline;-webkit-tap-highlight-color:transparent}
.manual-session{display:none;flex-direction:column;gap:8px;margin-top:4px;padding:12px;background:var(--bg3);border-radius:var(--radius-sm);border:1px solid var(--border2)}
.manual-session.open{display:flex}
.ms-row{display:flex;align-items:center;gap:10px}
.ms-row label{font-size:12px;color:var(--text2);width:60px;flex-shrink:0}
.ms-input{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-xs);padding:8px 10px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;-webkit-appearance:none}
.ms-input:focus{outline:none;border-color:var(--orange)}
.ms-msg{font-size:12px;text-align:center;min-height:16px;margin:0}
.ms-msg.ok{color:#6FCF76}
.ms-msg.err{color:#E87070}
.dash-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.dash-stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 10px;text-align:center}
.ds-val{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--orange);line-height:1}
.ds-lbl{font-size:11px;color:var(--text2);margin-top:4px}
.obj-card{background:linear-gradient(135deg,rgba(31,86,115,.25),rgba(31,86,115,.08));border:1px solid rgba(31,86,115,.4);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.obj-head{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--orange);margin-bottom:8px}
.obj-main{font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px}
.obj-target{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.obj-cur{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--text2)}
.obj-arrow{color:var(--text3);font-size:18px}
.obj-goal{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--orange)}
.obj-note{font-size:12px;color:var(--text2);line-height:1.5}
.improved-box{display:flex;flex-direction:column;gap:4px}
.improved-box strong{font-size:14px;color:var(--text)}
.improved-box span{font-size:13px;color:var(--text2)}
.ach-list{display:flex;flex-direction:column;gap:6px}
.ach-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm);background:var(--bg3);opacity:.5}
.ach-item.ach-got{opacity:1;background:rgba(31,86,115,.12);border:1px solid rgba(31,86,115,.25)}
.ach-icon{font-size:22px;flex-shrink:0}
.ach-info{flex:1;display:flex;flex-direction:column;gap:1px}
.ach-info strong{font-size:13px;color:var(--text)}
.ach-info span{font-size:11px;color:var(--text2)}
.ach-check{color:#6FCF76;font-size:16px;font-weight:700;flex-shrink:0}

/* COACH - SUGERENCIAS */
.sug-card{display:flex;gap:10px;padding:12px;border-radius:var(--radius-sm);margin-bottom:8px;align-items:flex-start}
.sug-up{background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.25)}
.sug-down{background:rgba(231,112,112,.1);border:1px solid rgba(231,112,112,.25)}
.sug-muscle{background:rgba(31,86,115,.12);border:1px solid rgba(31,86,115,.3)}
.sug-icon{font-size:18px;flex-shrink:0;line-height:1.3}
.sug-text{display:flex;flex-direction:column;gap:3px}
.sug-text strong{font-size:13px;color:var(--text);font-weight:600}
.sug-text span{font-size:12px;color:var(--text2);line-height:1.5}

/* COACH - CALENDARIO */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;color:var(--text)}
.cal-nav{width:32px;height:32px;border:1px solid var(--border2);background:var(--bg3);border-radius:8px;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-nav:active{background:var(--bg4)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.cal-dow{text-align:center;font-size:10px;color:var(--text3);font-weight:600;padding:4px 0}
.cal-empty{aspect-ratio:1}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2);border-radius:8px;background:var(--bg3);position:relative}
.cal-trained{background:var(--orange);color:#fff;font-weight:600}
.cal-today{border:1.5px solid var(--orange)}
.cal-trained.cal-today{border-color:#fff}
.cal-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.cal-stat{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 6px;text-align:center}
.cal-stat-val{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--orange);line-height:1}
.cal-stat-lbl{font-size:10px;color:var(--text2);margin-top:3px}

/* MEDIDAS */
.medidas-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.med-item{display:flex;flex-direction:column;gap:4px}
.med-item label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3)}
.med-item input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-xs);padding:9px 10px;font-size:14px;font-weight:500;color:var(--text);font-family:'DM Sans',sans-serif;width:100%;-webkit-appearance:none;appearance:none}
.med-item input:focus{outline:none;border-color:var(--orange)}
.med-item input::placeholder{color:var(--text3)}
.save-btn{width:100%;margin-top:14px;padding:14px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;letter-spacing:.3px;-webkit-tap-highlight-color:transparent;transition:background .15s}
.save-btn:active{background:var(--orange-dark)}
.saved-msg{text-align:center;font-size:12px;color:var(--green);margin-top:8px;height:18px}

/* HISTORIAL */
.hist-week{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.hist-week-header{padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer}
.hist-week-header h3{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;color:var(--text);flex:1}
.hist-count{font-size:11px;color:var(--text2)}
.hist-table{width:100%;border-collapse:collapse;font-size:11px}
.hist-table th{text-align:left;padding:5px 14px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.4px;background:var(--bg3)}
.hist-table td{padding:7px 14px;border-bottom:1px solid var(--border);color:var(--text2)}
.hist-table td:first-child{color:var(--text);font-size:10px}
.hist-table tr:last-child td{border-bottom:none}
.empty-state{text-align:center;padding:48px 16px;color:var(--text3)}
.empty-state svg{width:40px;height:40px;stroke:var(--text3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin:0 auto 12px;display:block}
.empty-state p{font-size:13px}

/* AJUSTES */
.ajustes-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.ajustes-card-header{padding:14px 16px;border-bottom:1px solid var(--border)}
.ajustes-card-header h3{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;color:var(--text)}
.ajustes-card-header p{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.4}
.ajustes-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ajustes-btn{width:100%;padding:13px 16px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg3);font-size:14px;font-weight:500;color:var(--text);font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent;transition:background .15s}
.ajustes-btn:active{background:var(--bg4)}
.ajustes-btn svg{width:20px;height:20px;stroke:var(--orange);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ajustes-btn.danger svg{stroke:#E87070}
.ajustes-btn.danger{color:#E87070}
.ajustes-btn-sub{font-size:11px;color:var(--text3);margin-left:auto}
.import-input{display:none}
.ajustes-msg{font-size:12px;text-align:center;min-height:18px;margin-top:2px}
.ajustes-msg.ok{color:var(--green)}
.ajustes-msg.err{color:#E87070}
.ficha-info{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px}
.ficha-info p{font-size:12px;color:var(--text2);line-height:1.6}
.ficha-info strong{color:var(--orange)}

/* COMPLETION RING */
.ring-wrap{position:relative;width:44px;height:44px;flex-shrink:0}
.ring-svg{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--border2);stroke-width:3}
.ring-prog{fill:none;stroke:var(--orange);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--text2)}
.ring-text.done{color:var(--green)}
</style>
</head>
<body>

      Ajustes
    </button>

<!-- WEEK MODAL -->
<div class="modal-overlay" id="weekModal" onclick="closeWeekModal(event)">
  <div class="modal">
    <h3>SELECCIONAR SEMANA</h3>
    <div class="week-grid" id="weekGrid"></div>
  </div>

<!-- EDITOR MODAL -->
<div class="editor-overlay" id="editorModal">
  <div class="editor-panel">
    <div class="editor-header">
      <h3>EDITAR RUTINA</h3>
      <button class="editor-close" onclick="closeEditor()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

      <button class="editor-btn-primary" onclick="saveEditorChanges()">Guardar cambios</button>
    </div>
  </div>
</div>

// ── SISTEMA MULTI-RUTINA ──
// routines: [{id, name, days:[...], data:{}}]. Cada rutina tiene sus días y sus pesos.
let routines = [];
let activeRoutineId = null;
let state = { week:1, openDays:{d1:true}, medidas:{} };
let restTimers = {};

// Atajos: DAYS y data de la rutina activa
function activeRoutine(){ return routines.find(r=>r.id===activeRoutineId) || routines[0]; }
Object.defineProperty(window,'DAYS',{get(){const r=activeRoutine();return r?r.days:[];},set(v){const r=activeRoutine();if(r)r.days=v;}});

function newRoutineId(){ return 'rt_'+Date.now()+'_'+Math.floor(Math.random()*1000); }

function load(){
  try{
    // Cargar colección de rutinas (formato nuevo)
    const rs=localStorage.getItem('pg16_routines');
    const act=localStorage.getItem('pg16_active');
    const med=localStorage.getItem('pg16_medidas');
    if(med){state.medidas=JSON.parse(med)||{};}
    if(rs){
      routines=JSON.parse(rs)||[];
    }
    if(act) activeRoutineId=act;

    // ── MIGRACIÓN desde formato viejo (una sola rutina) ──
    if(!routines.length){
      let oldDays=null, oldData={}, oldMed={};
      const r=localStorage.getItem('pg16_routine');
      if(r){const rd=JSON.parse(r);if(Array.isArray(rd)&&rd.length) oldDays=rd;}
      const s=localStorage.getItem('pg16');
      if(s){const p=JSON.parse(s);oldData=p.data||{};oldMed=p.medidas||{};}
      routines=[{
        id:newRoutineId(),
        name:'Mi rutina',
        days: oldDays || JSON.parse(JSON.stringify(DEFAULT_DAYS)),
        data: oldData
      }];
      if(oldMed && Object.keys(oldMed).length) state.medidas=oldMed;
      activeRoutineId=routines[0].id;
      saveAll();
    }
    if(!activeRoutineId || !routines.find(r=>r.id===activeRoutineId)) activeRoutineId=routines[0].id;
  }catch(e){
    // fallback: una rutina nueva limpia
    routines=[{id:newRoutineId(),name:'Mi rutina',days:JSON.parse(JSON.stringify(DEFAULT_DAYS)),data:{}}];
    activeRoutineId=routines[0].id;
  }
}
function saveAll(){
  try{
    localStorage.setItem('pg16_routines',JSON.stringify(routines));
    localStorage.setItem('pg16_active',activeRoutineId);
    localStorage.setItem('pg16_medidas',JSON.stringify(state.medidas));
  }catch(e){}
}
function save(){ saveAll(); }
function saveRoutine(){ saveAll(); }

// ── Acceso a datos de la rutina ACTIVA ──
function gk(w,d,e,f){return `${w}|${d}|${e}|${f}`;}
function gd(w,d,e,f,def=''){const r=activeRoutine();return (r&&r.data[gk(w,d,e,f)])??def;}
function sd(w,d,e,f,v){const r=activeRoutine();if(r){r.data[gk(w,d,e,f)]=v;saveAll();}}

// ── Gestión de rutinas ──
function switchRoutine(id){
  if(routines.find(r=>r.id===id)){activeRoutineId=id;state.openDays={};saveAll();renderInicio();renderRutina();}
}
function createRoutine(name){
  const r={id:newRoutineId(),name:name||'Nueva rutina',days:JSON.parse(JSON.stringify(DEFAULT_DAYS)),data:{}};
  routines.push(r);
  activeRoutineId=r.id;
  saveAll();
  renderRutina();
  return r;
}
function createBlankRoutine(name){
  const r={id:newRoutineId(),name:name||'Nueva rutina',days:[
    {id:'d1',name:'Día 1',muscle:'',warmup:[],abs:[],exercises:[]}
  ],data:{}};
  routines.push(r);
  activeRoutineId=r.id;
  saveAll();
  renderRutina();
  return r;
}
function deleteRoutine(id){
  if(routines.length<=1){alert('No podés borrar la única rutina. Creá otra primero.');return;}
  routines=routines.filter(r=>r.id!==id);
  if(activeRoutineId===id) activeRoutineId=routines[0].id;
  saveAll();
}
function renameRoutine(id,name){
  const r=routines.find(x=>x.id===id);
  if(r){r.name=name;saveAll();}
}

// ── GLOBAL: buscar un ejercicio por NOMBRE en TODAS las rutinas ──
// Devuelve todas las (rutina, día, ejercicio) que comparten el mismo nombre normalizado
function normName(n){return (n||'').trim().toLowerCase().replace(/\s+/g,' ');}
function allExerciseInstances(name){
  const target=normName(name);
  const out=[];
  routines.forEach(rt=>rt.days.forEach(day=>day.exercises.forEach(ex=>{
    if(normName(ex.name)===target) out.push({routine:rt,day,ex});
  })));
  return out;
}
// PR global de un ejercicio por nombre (across todas las rutinas)
function globalPR(name){
  let pr=0, where='';
  allExerciseInstances(name).forEach(inst=>{
    const s=parseInt(inst.ex.series)||1;
    for(let wk=1;wk<=5;wk++){
      for(let i=0;i<s;i++){
        const p=parseFloat(inst.routine.data[gk(wk,inst.day.id,inst.ex.id,'p'+i)]||'');
        if(p>0&&p>pr){pr=p;where=inst.routine.name;}
      }
    }
  });
  return {pr,where};
}

// Copiar pesos de la semana anterior a la actual
function copyPrevWeek(){
  const w=state.week;
  if(w<=1) return;
  if(!confirm(`¿Copiar todos los pesos de la Semana ${w-1} a la Semana ${w}? Los pesos que ya cargaste en esta semana se sobrescriben.`)) return;
  DAYS.forEach(day=>{
    day.exercises.forEach(ex=>{
      const s=parseInt(ex.series)||1;
      for(let i=0;i<s;i++){
        const prev=gd(w-1,day.id,ex.id,'p'+i,'');
        if(prev!=='') sd(w,day.id,ex.id,'p'+i,prev);
        const prevB=gd(w-1,day.id,ex.id,'pb'+i,'');
        if(prevB!=='') sd(w,day.id,ex.id,'pb'+i,prevB);
      }
    });
  });
  renderRutina();
}

// Backup reminder
function shouldShowBackup(){
  try{
    if(localStorage.getItem('pg16_backup_dismiss')==='1') return false;
    const last=localStorage.getItem('pg16_last_backup');
    // Solo mostrar si hay datos cargados
    const r=activeRoutine();
    if(!r || Object.keys(r.data).length<5) return false;
    if(!last) return true;
    const days=(Date.now()-parseInt(last))/(1000*60*60*24);
    return days>=14;
  }catch(e){return false;}
}

// RING SVG
function ring(pct){
  const r=18,c=2*Math.PI*r,off=c*(1-pct/100);
  const col=pct===100?'#4CAF50':'#1F5673';
  return `<div class="ring-wrap"><svg class="ring-svg" width="44" height="44" viewBox="0 0 44 44"><circle class="ring-track" cx="22" cy="22" r="${r}"/><circle class="ring-prog" cx="22" cy="22" r="${r}" stroke="${col}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="ring-text${pct===100?' done':''}">${pct}%</div></div>`;
}

// COMPLETION
// Estado de un ejercicio en una semana: 'done' (cargó peso en al menos 1 serie), 'skip' (marcado no hice), 'pending' (nada)
function exStatus(w,dayId,ex){
  if(gd(w,dayId,ex.id,'skip','0')==='1') return 'skip';
  const s=parseInt(ex.series)||1;
  for(let i=0;i<s;i++){ if(gd(w,dayId,ex.id,'p'+i,'')!=='' || gd(w,dayId,ex.id,'pb'+i,'')!=='') return 'done'; }
  return 'pending';
}

// % del día = ejercicios hechos / total. Los saltados cuentan como "no hechos".
function getDayPct(w,day){
  const total=day.exercises.length;
  if(total===0) return 0;
  let done=0;
  day.exercises.forEach(ex=>{ if(exStatus(w,day.id,ex)==='done') done++; });
  return Math.round(done/total*100);
}

// ¿El día está marcado como finalizado?
function isDayFinished(w,dayId){ return gd(w,dayId,'_day','fin','0')==='1'; }
function finishDay(w,dayId){
  sd(w,dayId,'_day','fin','1');
  // Registrar fecha de finalización (para el calendario)
  if(gd(w,dayId,'_day','date','')==='') sd(w,dayId,'_day','date',new Date().toISOString());
  renderRutina();
}
function reopenDay(w,dayId){
  sd(w,dayId,'_day','fin','0');
  renderRutina();
}

    <button class="edit-routine-btn" onclick="openEditor()">
      <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>

    </button>
  </div>`;
  c.appendChild(topBar);
  DAYS.forEach(day=>{
    const open=!!state.openDays[day.id];

      ${ring(pct)}
      <svg class="day-chevron${open?' open':''}" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>`;
    if(open){
      html+=`<div class="warmup-block"><h4>🔥 Entrada en calor</h4><div class="chips">`;

      // Botón terminar día / resumen
      const fin=isDayFinished(state.week,day.id);
      let doneN=0,skipN=0,pendN=0;
      day.exercises.forEach(ex=>{const st=exStatus(state.week,day.id,ex);if(st==='done')doneN++;else if(st==='skip')skipN++;else pendN++;});
      if(fin){
        html+=`<div class="day-finish-block">
          <div class="day-finish-summary">
            <span class="dfs-item dfs-done">✓ ${doneN} hechos</span>
            ${skipN>0?`<span class="dfs-item dfs-skip">✕ ${skipN} salteados</span>`:''}
            ${pendN>0?`<span class="dfs-item dfs-pend">○ ${pendN} sin registrar</span>`:''}
          </div>
          <button class="reopen-day-btn" onclick="reopenDay(${state.week},'${day.id}')">Reabrir día</button>
        </div>`;
      } else {
        html+=`<div class="day-finish-block">
          <button class="finish-day-btn" onclick="finishDay(${state.week},'${day.id}')">✓ Terminar día (Semana ${state.week})</button>
        </div>`;
      }
    }
    card.innerHTML=html;
    c.appendChild(card);
  });
}

// ¿Es bi-serie? Auto-detecta por nombre o por flag manual ex.bi
function isBiserie(ex){
  if(ex.bi===true) return true;
  if(ex.bi===false) return false;
  return /bi[\s\-]?serie/i.test(ex.name||'');
}
function isDropset(ex){
  if(ex.drop===true) return true;
  if(ex.drop===false) return false;
  return /dropset/i.test(ex.tag||'') || /dropset/i.test(ex.name||'');
}
function biserieNames(ex){
  let n=(ex.name||'').replace(/bi[\s\-]?serie\s*:?\s*/i,'');
  const parts=n.split(/\s*\+\s*/);
  if(parts.length>=2) return [parts[0].trim(),parts.slice(1).join(' + ').trim()];
  return ['Ejercicio A','Ejercicio B'];
}

function renderEx(dayId,ex){
  const w=state.week,e=ex.id,d=dayId;
  const s=parseInt(ex.series)||1;
  const tiempo=gd(w,d,e,'tiempo','');
  const nota=gd(w,d,e,'nota','');
  const skipped=gd(w,d,e,'skip','0')==='1';
  const repsArr=(ex.reps||'').split(/[-/]/).map(r=>r.trim());
  const bi=isBiserie(ex);
  const drop=!bi&&isDropset(ex);
  const biNames=bi?biserieNames(ex):null;

  let setsHtml='';
  if(bi){
    setsHtml+=`<div class="bi-head"><span class="bi-label-a">${biNames[0]}</span><span class="bi-label-b">${biNames[1]}</span></div>`;
  } else if(drop){
    setsHtml+=`<div class="bi-head"><span class="bi-label-a">Peso inicial</span><span class="bi-label-b">Peso drop</span></div>`;
  }

  for(let i=0;i<s;i++){
    const peso=gd(w,d,e,'p'+i,'');
    const prevPeso=w>1?gd(w-1,d,e,'p'+i,''):'';
    const repTarget=repsArr.length===1?repsArr[0]:(repsArr[i]||repsArr[repsArr.length-1]||'');
    let prevTag='';
    if(prevPeso){
      let cls='prev-same';
      if(peso){const dv=parseFloat(peso)-parseFloat(prevPeso);cls=dv>0?'prev-up':dv<0?'prev-dn':'prev-same';}
      prevTag=`<span class="prev-weight ${cls}">ant: ${prevPeso}</span>`;
    }

    if(bi||drop){
      const pesoB=gd(w,d,e,'pb'+i,'');
      const prevB=w>1?gd(w-1,d,e,'pb'+i,''):'';
      let prevTagB='';
      if(prevB){let cls='prev-same';if(pesoB){const dv=parseFloat(pesoB)-parseFloat(prevB);cls=dv>0?'prev-up':dv<0?'prev-dn':'prev-same';}prevTagB=`<span class="prev-weight ${cls}">ant: ${prevB}</span>`;}
      const filled=(peso||pesoB)?' set-filled':'';
      setsHtml+=`<div class="set-line set-bi${filled}">
        <div class="set-num">${i+1}</div>
        <div class="bi-inputs">
          <div class="bi-input-col">
            <input class="set-weight" type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${peso}" onchange="onWeightChange(${w},'${d}','${e}','p${i}',this.value)">
            ${prevTag}
          </div>
          <div class="bi-input-col">
            <input class="set-weight" type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${pesoB}" onchange="onWeightChange(${w},'${d}','${e}','pb${i}',this.value)">
            ${prevTagB}
          </div>
        </div>
      </div>`;
    } else {
      setsHtml+=`<div class="set-line${peso?' set-filled':''}">
        <div class="set-num">${i+1}</div>
        <div class="set-rep">${repTarget?repTarget+' reps':''}</div>
        <input class="set-weight" type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${peso}" onchange="onWeightChange(${w},'${d}','${e}','p${i}',this.value)">
        ${prevTag}
      </div>`;
    }
  }

  return `<div class="exercise${skipped?' ex-skipped':''}">
    <div class="ex-name">${ex.name}${ex.tag?`<span class="ex-tag">${ex.tag}</span>`:''}${skipped?'<span class="skip-tag">No lo hice</span>':''}</div>
    <div class="ex-meta">${ex.series} series · ${ex.reps}</div>
    <div class="sets-list">${setsHtml}</div>
    <div class="ex-bottom">
      <div class="inp-group inp-time"><label>Tiempo total (seg)</label><input type="number" inputmode="numeric" step="1" placeholder="—" value="${tiempo}" onchange="sd(${w},'${d}','${e}','tiempo',this.value)"></div>
      <button class="rest-btn" id="rb_${d}_${e}" ontouchstart="" onclick="startRest('${d}','${e}',${ex.rest})">
        <svg class="rest-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="rt_${d}_${e}">${ex.rest}s</span>
      </button>
      <button class="skip-btn${skipped?' active':''}" onclick="toggleSkip(${w},'${d}','${e}')" title="Marcar como no hecho">
        ${skipped?'↩ Deshacer':'No lo hice'}
      </button>
    </div>
    <textarea class="ex-notes" rows="1" placeholder="Notas del ejercicio..." onchange="sd(${w},'${d}','${e}','nota',this.value)">${nota}</textarea>
  </div>`;
}

function onWeightChange(w,dayId,exId,key,val){
  sd(w,dayId,exId,key,val);
  // Si cargás peso, deja de estar "saltado"
  if(val && gd(w,dayId,exId,'skip','0')==='1') sd(w,dayId,exId,'skip','0');
  renderRutina();
}

function toggleSkip(w,dayId,exId){
  const cur=gd(w,dayId,exId,'skip','0');

let restIntervalMap={};
function startRest(dayId,exId,total){
  const key=`${dayId}_${exId}`;
  if(restIntervalMap[key]){clearInterval(restIntervalMap[key]);delete restIntervalMap[key];}
  let rem=total;
  const btn=document.getElementById(`rb_${dayId}_${exId}`);
  const txt=document.getElementById(`rt_${dayId}_${exId}`);
  if(!btn||!txt) return;
  btn.className='rest-btn running';
  const tick=()=>{
    if(!document.getElementById(`rt_${dayId}_${exId}`)){clearInterval(restIntervalMap[key]);return;}
    if(rem<0){
      clearInterval(restIntervalMap[key]);
      btn.className='rest-btn done-rest';
      txt.textContent='¡Listo!';
      if('vibrate' in navigator) navigator.vibrate([100,50,100]);
      setTimeout(()=>{if(document.getElementById(`rt_${dayId}_${exId}`)){btn.className='rest-btn';txt.textContent=total+'s';}},2500);
      return;
    }
    txt.textContent=rem+'s';
    rem--;
  };
  tick();
  restIntervalMap[key]=setInterval(tick,1000);
}

// Tiempo total entrenado (suma de sesiones con entrada y salida), en minutos
function totalMinutesTrained(){
  let mins=0;
  routines.forEach(rt=>{
    for(let wk=1;wk<=5;wk++) rt.days.forEach(day=>{
      const ci=rt.data[gk(wk,day.id,'_day','checkin')]||'';
      const co=rt.data[gk(wk,day.id,'_day','checkout')]||'';
      if(ci&&co){const diff=(new Date(co)-new Date(ci))/60000;if(diff>0&&diff<600)mins+=diff;}
    });
  });
  return Math.round(mins);
}

// Peso total movido en la vida (suma de peso×reps de TODAS las rutinas)
function totalWeightMoved(){
  let total=0;
  routines.forEach(rt=>{
    for(let wk=1;wk<=5;wk++) rt.days.forEach(day=>day.exercises.forEach(ex=>{
      const s=parseInt(ex.series)||1;
      const repsArr=(ex.reps||'').split(/[-/]/).map(r=>parseInt(r.trim())||0);
      for(let i=0;i<s;i++){
        const reps=repsArr.length===1?(repsArr[0]||0):(repsArr[i]||repsArr[repsArr.length-1]||0);
        const p=parseFloat(rt.data[gk(wk,day.id,ex.id,'p'+i)]||'');
        if(p>0) total+=p*reps;
        const pb=parseFloat(rt.data[gk(wk,day.id,ex.id,'pb'+i)]||'');
        if(pb>0) total+=pb*reps;
      }
    }));
  });
  return Math.round(total);
}

// Ejercicio más mejorado (mayor diferencia entre primera y última semana con datos)
function mostImproved(){
  let best=null;
  DAYS.forEach(day=>day.exercises.forEach(ex=>{
    let first=0,last=0,fw=0,lw=0;
    for(let wk=1;wk<=5;wk++){const m=exMaxWeight(wk,day.id,ex);if(m>0){if(first===0){first=m;fw=wk;}last=m;lw=wk;}}
    if(first>0&&lw>fw){const diff=last-first;if(!best||diff>best.diff){best={name:ex.name,diff,first,last};}}
  }));
  return best;
}

// Próximo récord posible: PR actual + incremento sugerido
function nextPossiblePR(){
  let bestPR=0,bestName='';
  DAYS.forEach(day=>day.exercises.forEach(ex=>{
    const {pr}=globalPR(ex.name);
    if(pr>bestPR){bestPR=pr;bestName=ex.name;}
  }));
  if(bestPR===0) return null;
  const inc=bestPR>=50?5:2.5;
  return {name:bestName,current:bestPR,target:bestPR+inc};
}

// Logros automáticos
function getAchievements(){
  const a=[];
  const totalDays=countTotalTrained();
  const streak=currentStreak();
  const moved=totalWeightMoved();
  const mins=totalMinutesTrained();

  a.push({got:totalDays>=1,icon:'🎯',title:'Primer entrenamiento',desc:'Registraste tu primer día'});
  a.push({got:totalDays>=10,icon:'🔥',title:'10 entrenamientos',desc:`${totalDays}/10 días registrados`});
  a.push({got:totalDays>=25,icon:'💪',title:'25 entrenamientos',desc:`${totalDays}/25 días registrados`});
  a.push({got:streak>=2,icon:'📅',title:'2 semanas seguidas',desc:'Constancia sostenida'});
  a.push({got:streak>=4,icon:'🏅',title:'1 mes sin abandonar',desc:'4 semanas consecutivas'});
  a.push({got:moved>=10000,icon:'🏋️',title:'10 toneladas movidas',desc:`${(moved/1000).toFixed(1)}t acumuladas`});
  a.push({got:moved>=50000,icon:'🦣',title:'50 toneladas movidas',desc:`${(moved/1000).toFixed(1)}t acumuladas`});
  // PR de press plano en hitos
  let benchPR=0;
  DAYS.forEach(day=>day.exercises.forEach(ex=>{if(/press plano|banca/i.test(ex.name)){const {pr}=globalPR(ex.name);if(pr>benchPR)benchPR=pr;}}));
  if(benchPR>0){
    a.push({got:benchPR>=60,icon:'🛋️',title:'60kg en press plano',desc:benchPR>=60?'¡Logrado!':`Vas por ${benchPR}kg`});
    a.push({got:benchPR>=80,icon:'⚡',title:'80kg en press plano',desc:benchPR>=80?'¡Logrado!':`Vas por ${benchPR}kg`});
  }
  if(mins>=600) a.push({got:true,icon:'⏱️',title:'10 horas de gym',desc:`${(mins/60).toFixed(0)}h acumuladas`});
  return a;
}

  let openSession=null;
  DAYS.forEach(day=>{
    const ci=gd(w,day.id,'_day','checkin','');

    </div>`;

  const movedTxt=moved>=1000?(moved/1000).toFixed(1)+'t':moved+'kg';
  const streak=currentStreak();
  const improved=mostImproved();
  const nextPR=nextPossiblePR();

  // ── Objetivo sugerido ──
  let objHtml='';
  if(nextPR){
    objHtml=`<div class="obj-card">
      <div class="obj-head">🎯 PRÓXIMO OBJETIVO</div>
      <div class="obj-main">${nextPR.name}</div>
      <div class="obj-target"><span class="obj-cur">${nextPR.current}kg</span> <span class="obj-arrow">→</span> <span class="obj-goal">${nextPR.target}kg</span></div>
      <div class="obj-note">Subí ${(nextPR.target-nextPR.current)} kg respecto a tu récord actual. Meta realista para las próximas 2-3 semanas.</div>
    </div>`;
  } else {
    objHtml=`<div class="obj-card"><div class="obj-note" style="text-align:center;padding:8px">Cargá pesos en tus ejercicios para que la app te sugiera un objetivo personalizado.</div></div>`;
  }

  // ── Logros ──
  const achievements=getAchievements();
  let achHtml='';
  achievements.forEach(a=>{
    achHtml+=`<div class="ach-item${a.got?' ach-got':''}"><div class="ach-icon">${a.icon}</div><div class="ach-info"><strong>${a.title}</strong><span>${a.desc}</span></div>${a.got?'<div class="ach-check">✓</div>':''}</div>`;
  });

  // ── SUGERENCIAS (igual que antes) ──
  const sugs=[];
  DAYS.forEach(day=>day.exercises.forEach(ex=>{
    const series=[];
    for(let wk=1;wk<=5;wk++){const m=exMaxWeight(wk,day.id,ex);if(m>0)series.push(m);}
    if(series.length>=3){
      const last3=series.slice(-3);
      if(last3[0]===last3[1] && last3[1]===last3[2]){
        sugs.push({type:'up',icon:'⬆️',title:`Subí el peso en ${ex.name}`,text:`Llevás 3 semanas con ${last3[0]}kg. Tu cuerpo ya se adaptó: probá subir 2.5-5kg la próxima.`});
      }
    }
  }));
  DAYS.forEach(day=>day.exercises.forEach(ex=>{
    for(let wk=2;wk<=5;wk++){
      const cur=exMaxWeight(wk,day.id,ex);
      const prev=exMaxWeight(wk-1,day.id,ex);
      if(cur>0 && prev>0 && cur<prev){
        sugs.push({type:'down',icon:'⚠️',title:`Bajó el peso en ${ex.name}`,text:`Semana ${wk-1}: ${prev}kg → Semana ${wk}: ${cur}kg. Puede ser fatiga o mala recuperación. Revisá descanso y alimentación.`});
        break;
      }
    }
  }));
  DAYS.forEach(day=>{
    let trained=false;
    for(let wk=1;wk<=5;wk++){
      if(isDayFinished(wk,day.id)){trained=true;break;}
      if(day.exercises.some(ex=>exMaxWeight(wk,day.id,ex)>0)){trained=true;break;}
    }
    if(!trained){
      sugs.push({type:'muscle',icon:'🎯',title:`${day.muscle} sin registrar`,text:`Todavía no entrenaste ${day.name} (${day.muscle}). No descuides este grupo para un desarrollo parejo.`});

  let sugsHtml='';
  if(sugs.length===0){
    sugsHtml='<p class="evo-note" style="padding:8px 2px">Cuando tengas más semanas registradas, acá van a aparecer sugerencias: cuándo subir peso, alertas de bajones y grupos sin entrenar.</p>';
  } else {
    sugs.slice(0,5).forEach(s=>{
      sugsHtml+=`<div class="sug-card sug-${s.type}"><div class="sug-icon">${s.icon}</div><div class="sug-text"><strong>${s.title}</strong><span>${s.text}</span></div></div>`;
    });
  }

  // ── CALENDARIO ──
  const trainedDates={};
  routines.forEach(rt=>{
    for(let wk=1;wk<=5;wk++) rt.days.forEach(day=>{
      const ds=rt.data[gk(wk,day.id,'_day','date')]||'';
      if(ds){const d=new Date(ds);trainedDates[`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`]=true;}
    });
  });
  if(!window.coachMonth){const now=new Date();window.coachMonth={y:now.getFullYear(),m:now.getMonth()};}
  const cy=window.coachMonth.y, cm=window.coachMonth.m;
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const startWeekday=(new Date(cy,cm,1).getDay()+6)%7;
  const daysInMonth=new Date(cy,cm+1,0).getDate();
  let trainedThisMonth=0;
  for(let d=1;d<=daysInMonth;d++){if(trainedDates[`${cy}-${cm}-${d}`])trainedThisMonth++;}
  let calCells='';
  ['L','M','X','J','V','S','D'].forEach(d=>calCells+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startWeekday;i++) calCells+=`<div class="cal-empty"></div>`;
  const today=new Date();
  for(let d=1;d<=daysInMonth;d++){
    const trained=trainedDates[`${cy}-${cm}-${d}`];
    const isToday=today.getFullYear()===cy&&today.getMonth()===cm&&today.getDate()===d;
    calCells+=`<div class="cal-day${trained?' cal-trained':''}${isToday?' cal-today':''}">${d}</div>`;
  }

  document.getElementById('page-inicio').innerHTML=`
    <div class="hero-greeting">${greeting()}, Tomás 👋</div>

    <div class="section-card checkin-card">
      <h3>⏱️ TIEMPO DE ENTRENAMIENTO</h3>
      ${timeHtml}
    </div>

    <div class="dash-stats">
      <div class="dash-stat"><div class="ds-val">${streak}</div><div class="ds-lbl">semanas de racha</div></div>
      <div class="dash-stat"><div class="ds-val">${horas}</div><div class="ds-lbl">horas en el gym</div></div>
      <div class="dash-stat"><div class="ds-val">${movedTxt}</div><div class="ds-lbl">peso total movido</div></div>
      <div class="dash-stat"><div class="ds-val">${countTotalTrained()}</div><div class="ds-lbl">entrenamientos</div></div>
    </div>

    ${objHtml}

    ${improved?`<div class="section-card">
      <h3>📈 EJERCICIO MÁS MEJORADO</h3>
      <div class="improved-box"><strong>${improved.name}</strong><span>${improved.first}kg → ${improved.last}kg <span class="diff-badge diff-up">+${improved.diff}kg</span></span></div>
    </div>`:''}

    <div class="section-card">
      <h3>🏆 LOGROS</h3>
      <div class="ach-list">${achHtml}</div>
    </div>

    <div class="section-card">
      <h3>💡 SUGERENCIAS</h3>
      ${sugsHtml}
    </div>

    <div class="section-card">
      <h3>📅 CALENDARIO</h3>
      <div class="cal-header">
        <button class="cal-nav" onclick="coachMonthShift(-1)">‹</button>
        <span class="cal-title">${monthNames[cm]} ${cy}</span>
        <button class="cal-nav" onclick="coachMonthShift(1)">›</button>
      </div>
      <div class="cal-grid">${calCells}</div>
      <div class="cal-summary">
        <div class="cal-stat"><div class="cal-stat-val">${trainedThisMonth}</div><div class="cal-stat-lbl">días este mes</div></div>
        <div class="cal-stat"><div class="cal-stat-val">${countTotalTrained()}</div><div class="cal-stat-lbl">total</div></div>
        <div class="cal-stat"><div class="cal-stat-val">${streak}</div><div class="cal-stat-lbl">racha (sem)</div></div>
      </div>
    </div>
  `;
}

function greeting(){
  const h=new Date().getHours();
  if(h<12) return 'Buen día';
  if(h<20) return 'Buenas tardes';
  return 'Buenas noches';
}

function checkIn(dayId){
  const now=new Date().toISOString();
  sd(state.week,dayId,'_day','checkin',now);
  sd(state.week,dayId,'_day','checkout','');
  // Siempre actualizar la fecha del calendario con la fecha real del checkin
  sd(state.week,dayId,'_day','date',now);
  renderInicio();
}
function checkOut(dayId){
  sd(state.week,dayId,'_day','checkout',new Date().toISOString());
  renderInicio();
}

function saveManualSession(){
  const dayId=document.getElementById('msDay').value;
  const dateStr=document.getElementById('msDate').value;
  const inStr=document.getElementById('msIn').value;
  const outStr=document.getElementById('msOut').value;
  const msg=document.getElementById('msMsg');
  if(!dateStr||!inStr||!outStr){if(msg){msg.className='ms-msg err';msg.textContent='Completá fecha, entrada y salida.';}return;}
  const ci=new Date(`${dateStr}T${inStr}`);
  const co=new Date(`${dateStr}T${outStr}`);
  if(co<=ci){if(msg){msg.className='ms-msg err';msg.textContent='La salida tiene que ser después de la entrada.';}return;}
  sd(state.week,dayId,'_day','checkin',ci.toISOString());
  sd(state.week,dayId,'_day','checkout',co.toISOString());
  // Siempre usar la fecha real de la sesión para el calendario (no importa si ya había una)
  sd(state.week,dayId,'_day','date',ci.toISOString());
  // También marcar como día terminado si no estaba
  if(gd(state.week,dayId,'_day','fin','0')==='0') sd(state.week,dayId,'_day','fin','1');
  if(msg){msg.className='ms-msg ok';msg.textContent='✓ Sesión guardada y marcada en el calendario.';}
  setTimeout(()=>renderInicio(),700);
}

function coachMonthShift(delta){
  if(!window.coachMonth){const now=new Date();window.coachMonth={y:now.getFullYear(),m:now.getMonth()};}
  let m=window.coachMonth.m+delta, y=window.coachMonth.y;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  window.coachMonth={y,m};
  renderInicio();
}
function countTotalTrained(){
  let n=0;
  routines.forEach(rt=>{
    for(let wk=1;wk<=5;wk++) rt.days.forEach(day=>{if(rt.data[gk(wk,day.id,'_day','date')]) n++;});
  });
  return n;
}
function currentStreak(){
  let streak=0;
  for(let wk=1;wk<=5;wk++){
    const any=DAYS.some(day=>isDayFinished(wk,day.id));
    if(any) streak++; else if(streak>0) break;
  }
  return streak;
}

// PROGRESO
// Peso representativo de un ejercicio en una semana = el peso máximo entre sus series
function exMaxWeight(w,dayId,ex){
  const s=parseInt(ex.series)||1;
  let max=0;
  for(let i=0;i<s;i++){
    const p=parseFloat(gd(w,dayId,ex.id,'p'+i,''));
    if(p>0 && p>max) max=p;
    const pb=parseFloat(gd(w,dayId,ex.id,'pb'+i,''));
    if(pb>0 && pb>max) max=pb;
  }
  return max;
}
// Lista de pesos por serie como texto. Para bi-series muestra "A/B".
function exWeightsText(w,dayId,ex){
  const s=parseInt(ex.series)||1;
  const dual=isBiserie(ex)||isDropset(ex);
  const arr=[];
  for(let i=0;i<s;i++){
    const p=gd(w,dayId,ex.id,'p'+i,'');
    if(dual){
      const pb=gd(w,dayId,ex.id,'pb'+i,'');
      if(p||pb) arr.push(`${p||'-'}/${pb||'-'}`); else arr.push('-');
    } else {
      arr.push(p||'-');
    }
  }
  const hasAny=arr.some(x=>x!=='-');
  return hasAny?arr.join('·'):'-';
}

// Estado: ejercicio seleccionado para análisis
let progExSel = null; // {dayId, exId}

// Récord personal de un ejercicio: mayor peso registrado en cualquier serie/semana
function exPR(dayId,ex){
  let pr=0, prWeek=0;
  for(let wk=1;wk<=5;wk++){
    const s=parseInt(ex.series)||1;
    for(let i=0;i<s;i++){
      const p=parseFloat(gd(wk,dayId,ex.id,'p'+i,''));
      if(p>0 && p>pr){pr=p;prWeek=wk;}
    }
  }
  return {pr,prWeek};
}

function selectProgEx(dayId,exId){
  progExSel={dayId,exId};
  renderProgreso();
}

function renderProgreso(){
  const w=state.week;

  // ── Stats de la semana actual: ejercicios hechos sobre total ──
  let totEx=0,doneEx=0;
  DAYS.forEach(day=>day.exercises.forEach(ex=>{
    totEx++;
    if(exStatus(w,day.id,ex)==='done') doneEx++;
  }));
  const pct=totEx>0?Math.round(doneEx/totEx*100):0;

  // Volumen total de la semana (peso × reps × series completadas, aprox usando reps objetivo)
  function weekVolume(wk){
    let vol=0;
    DAYS.forEach(day=>day.exercises.forEach(ex=>{
      const s=parseInt(ex.series)||1;
      const repsArr=(ex.reps||'').split(/[-/]/).map(r=>parseInt(r.trim())||0);
      for(let i=0;i<s;i++){
        const p=parseFloat(gd(wk,day.id,ex.id,'p'+i,''));
        if(p>0){
          const reps=repsArr.length===1?(repsArr[0]||0):(repsArr[i]||repsArr[repsArr.length-1]||0);
          vol+=p*reps;
        }
      }
    }));
    return Math.round(vol);
  }
  const volNow=weekVolume(w);

  // ── Selector de ejercicio: armar opciones ──
  let exOptions='';
  DAYS.forEach(day=>{
    day.exercises.forEach(ex=>{
      const sel = progExSel && progExSel.dayId===day.id && progExSel.exId===ex.id;
      exOptions+=`<option value="${day.id}|${ex.id}" ${sel?'selected':''}>${day.name} · ${ex.name}</option>`;
    });
  });

  // Default: primer ejercicio si no hay selección
  if(!progExSel && DAYS[0] && DAYS[0].exercises[0]){
    progExSel={dayId:DAYS[0].id,exId:DAYS[0].exercises[0].id};
  }

  // ── Bloque de evolución del ejercicio seleccionado ──
  let evoHtml='';
  if(progExSel){
    const day=DAYS.find(d=>d.id===progExSel.dayId);
    const ex=day?day.exercises.find(e=>e.id===progExSel.exId):null;
    if(ex){
      const s=parseInt(ex.series)||1;
      const {pr,prWeek}=exPR(day.id,ex);
      // Tabla: filas = series, columnas = semanas
      let rows='';
      for(let i=0;i<s;i++){
        rows+=`<tr><td class="evo-set">Serie ${i+1}</td>`;
        for(let wk=1;wk<=5;wk++){
          const p=gd(wk,day.id,ex.id,'p'+i,'');
          const isPR = p && parseFloat(p)===pr && pr>0;
          rows+=`<td class="${isPR?'evo-pr':''}">${p?p:'·'}</td>`;
        }
        rows+=`</tr>`;
      }
      // Fila de máximo por semana
      let maxRow='<tr class="evo-maxrow"><td class="evo-set">Máx.</td>';
      for(let wk=1;wk<=5;wk++){
        const m=exMaxWeight(wk,day.id,ex);
        maxRow+=`<td>${m>0?m:'·'}</td>`;
      }
      maxRow+='</tr>';

      evoHtml=`
        <div class="evo-pr-badge">🏆 Récord: <strong>${pr>0?pr+' kg':'sin datos'}</strong>${pr>0?` (Semana ${prWeek})`:''}</div>
        <div class="evo-scroll">
        <table class="evo-table">
          <thead><tr><th></th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>S5</th></tr></thead>
          <tbody>${rows}${maxRow}</tbody>
        </table>
        </div>
        <p class="evo-note">Cada fila es una serie. Las celdas marcadas son tu récord en ese ejercicio.</p>
      `;
    }
  }

  // ── Récords personales de todos los ejercicios ──
  let prHtml='';
  DAYS.forEach(day=>{
    let dayRows='';
    day.exercises.forEach(ex=>{
      const {pr,prWeek}=exPR(day.id,ex);
      if(pr>0){
        dayRows+=`<tr><td>${ex.name}</td><td class="pr-val">${pr} kg</td><td class="pr-week">Sem ${prWeek}</td></tr>`;
      }
    });
    if(dayRows){
      prHtml+=`<p class="prog-day-label">${day.name.toUpperCase()} · ${day.muscle}</p>`;
      prHtml+=`<table class="prog-table"><tbody>${dayRows}</tbody></table>`;
    }
  });
  if(!prHtml) prHtml='<p class="evo-note" style="padding:8px 2px">Todavía no cargaste pesos. Tus récords van a aparecer acá a medida que entrenes.</p>';

  // Mini gráfico de volumen por semana
  let volBars='';
  let volMax=0;
  const vols=[];
  for(let wk=1;wk<=5;wk++){const v=weekVolume(wk);vols.push(v);if(v>volMax)volMax=v;}
  vols.forEach((v,i)=>{
    const h=volMax>0?Math.round(v/volMax*60):0;
    const lbl=v>=1000?(v/1000).toFixed(1)+'k':v;
    volBars+=`<div class="bar-group"><div class="bar-val">${v>0?lbl:''}</div><div class="bar-wrap"><div class="bar" style="height:${v>0?Math.max(h,4):2}px"></div></div><div class="bar-lbl">S${i+1}</div></div>`;
  });

  // ── Resumen por día de la semana actual ──
  let daysHtml='';
  DAYS.forEach(day=>{
    const dpct=getDayPct(w,day);
    const fin=isDayFinished(w,day.id);
    let doneList='',skipList='',pendList='';
    day.exercises.forEach(ex=>{
      const st=exStatus(w,day.id,ex);
      if(st==='done'){const mx=exMaxWeight(w,day.id,ex);doneList+=`<div class="dsum-ex dsum-done"><span>✓ ${ex.name}</span><span class="dsum-w">${mx>0?mx+' kg':''}</span></div>`;}
      else if(st==='skip') skipList+=`<div class="dsum-ex dsum-skip"><span>✕ ${ex.name}</span><span class="dsum-w">no lo hice</span></div>`;
      else pendList+=`<div class="dsum-ex dsum-pend"><span>○ ${ex.name}</span><span class="dsum-w">sin registrar</span></div>`;
    });
    daysHtml+=`<div class="dsum-card">
      <div class="dsum-head">
        <span class="day-badge">${day.name.toUpperCase()}</span>
        <span class="dsum-muscle">${day.muscle}</span>
        <span class="dsum-pct${dpct===100?' full':''}">${dpct}%${fin?' ✓':''}</span>
      </div>
      <div class="dsum-body">${doneList}${skipList}${pendList}</div>
    </div>`;
  });

  document.getElementById('page-progreso').innerHTML=`
    <div class="stats-row">
      <div class="stat-box"><div class="stat-val">${pct}%</div><div class="stat-lbl">Día completado S${w}</div></div>
      <div class="stat-box"><div class="stat-val">${doneEx}/${totEx}</div><div class="stat-lbl">Ejercicios hechos</div></div>
      <div class="stat-box"><div class="stat-val">${volNow>=1000?(volNow/1000).toFixed(1)+'k':volNow}</div><div class="stat-lbl">Volumen S${w} (kg)</div></div>
    </div>

    <div class="section-card">
      <h3>RESUMEN DE LA SEMANA ${w}</h3>
      ${daysHtml}
    </div>

    <div class="section-card">
      <h3>EVOLUCIÓN POR EJERCICIO</h3>
      <select class="prog-select" onchange="const v=this.value.split('|');selectProgEx(v[0],v[1])">${exOptions}</select>
      ${evoHtml}
    </div>

    <div class="section-card">
      <h3>VOLUMEN TOTAL POR SEMANA</h3>
      <div class="bar-chart">${volBars}</div>
      <p class="evo-note">Volumen = peso × reps × series. Subir el volumen semana a semana es señal de progreso real.</p>
    </div>

    <div class="section-card">
      <h3>🏆 RÉCORDS PERSONALES</h3>
      ${prHtml}
    </div>
  `;
}

// MEDIDAS

  let g='<div class="medidas-grid">';
  MEDIDAS.forEach(f=>{

    const val=state.medidas[`w${state.week}_${key}`]||'';
    g+=`<div class="med-item"><label>${f}</label><input type="number" inputmode="decimal" step="0.1" placeholder="—" value="${val}" onchange="state.medidas['w${state.week}_${key}']=this.value"></div>`;

  g+='</div><button class="save-btn" onclick="saveMedidas()">Guardar medidas</button><p class="saved-msg" id="savedMsg"></p>';
  document.getElementById('page-medidas').innerHTML=`<div class="section-card"><h3>MEDIDAS · SEMANA ${state.week}</h3>${g}</div>`;
}
function saveMedidas(){
  save();
  const m=document.getElementById('savedMsg');
  if(m){m.textContent='✓ Guardado correctamente';setTimeout(()=>{m.textContent='';},2000);}
}

// HISTORIAL
function renderHistorial(){
  const el=document.getElementById('page-historial');
  let html='';let any=false;
  for(let wk=5;wk>=1;wk--){
    let rows='';let cnt=0;
    DAYS.forEach(day=>day.exercises.forEach(ex=>{
      const wtext=exWeightsText(wk,day.id,ex);
      const pmax=exMaxWeight(wk,day.id,ex);
      const t=gd(wk,day.id,ex.id,'tiempo','');
      const n=gd(wk,day.id,ex.id,'nota','');
      const st=exStatus(wk,day.id,ex);
      const estado=st==='done'?'✓ Hecho':st==='skip'?'✕ No lo hice':'○ Pendiente';
      if(wtext!=='-'||t||n||st!=='pending'){
        cnt++;
        const prevMax=wk>1?exMaxWeight(wk-1,day.id,ex):0;
        let diff='';
        if(prevMax>0&&pmax>0){const dv=pmax-prevMax;if(dv>0) diff=`<span class="diff-badge diff-up">+${dv.toFixed(1)}</span>`;else if(dv<0) diff=`<span class="diff-badge diff-dn">${dv.toFixed(1)}</span>`;}
        rows+=`<tr><td>${ex.name}</td><td>${wtext!=='-'?wtext+' kg':'-'} ${diff}</td><td>${t?t+'s':'-'}</td><td>${estado}</td><td>${n||'-'}</td></tr>`;
      }
    }));
    if(cnt>0){
      any=true;
      html+=`<div class="hist-week"><div class="hist-week-header"><h3>SEMANA ${wk}</h3><span class="hist-count">${cnt} registros</span></div>
      <table class="hist-table"><thead><tr><th>Ejercicio</th><th>Peso</th><th>Tiempo</th><th>Estado</th><th>Notas</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
  }
  if(!any) html=`<div class="empty-state"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg><p>Todavía no hay nada registrado.<br>Completá series en la pestaña Rutina.</p></div>`;
  el.innerHTML=html;
}

function exportData(){
  const payload={
    version:'pg16-multi',
    exportDate:new Date().toISOString(),
    routines:routines,
    activeRoutineId:activeRoutineId,
    medidas:state.medidas
  };
  const json=JSON.stringify(payload,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const fecha=new Date().toISOString().slice(0,10);
  a.download=`rutina_datos_${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  try{localStorage.setItem('pg16_last_backup',String(Date.now()));localStorage.removeItem('pg16_backup_dismiss');}catch(e){}
  const msg=document.getElementById('exportMsg');
  if(msg){msg.textContent='✓ Archivo descargado correctamente';setTimeout(()=>msg.textContent='',3000);}
}

function importData(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const p=JSON.parse(e.target.result);
      if(p.routines && Array.isArray(p.routines)){
        // Formato nuevo multi-rutina
        routines=p.routines;
        activeRoutineId=p.activeRoutineId && routines.find(r=>r.id===p.activeRoutineId) ? p.activeRoutineId : routines[0].id;
        state.medidas=p.medidas||{};
      } else if(p.data){
        // Formato viejo: una sola rutina → la importamos como rutina activa nueva
        const r={id:newRoutineId(),name:'Rutina importada',days:(Array.isArray(p.routine)&&p.routine.length)?p.routine:JSON.parse(JSON.stringify(DEFAULT_DAYS)),data:p.data||{}};
        routines.push(r);
        activeRoutineId=r.id;
        state.medidas=p.medidas||state.medidas;
      } else throw new Error('inválido');
      saveAll();
      const msg=document.getElementById('importMsg');
      if(msg){msg.className='ajustes-msg ok';msg.textContent='✓ Datos importados correctamente';}
      renderRutina();renderInicio();
    }catch(err){
      const msg=document.getElementById('importMsg');
      if(msg){msg.className='ajustes-msg err';msg.textContent='✗ El archivo no es válido';}
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

function confirmReset(){
  const msg=document.getElementById('resetMsg');
  if(msg&&msg.dataset.confirm==='1'){
    const r=activeRoutine(); if(r) r.data={};
    msg.dataset.confirm='0';
    msg.textContent='✓ Datos de esta rutina borrados';
    saveAll();
    renderRutina();
    setTimeout(()=>{if(msg) msg.textContent='';},2500);
  } else {
    if(msg){msg.dataset.confirm='1';msg.textContent='Tocá de nuevo para confirmar';}
    setTimeout(()=>{if(msg){msg.dataset.confirm='0';msg.textContent='';}},3000);
  }
}

// INIT
load();
renderInicio();
renderRutina();
